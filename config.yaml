# ============================================================================
# LinkedIn Easy Apply Bot - Configuration File
# ============================================================================
# NOTE: Credentials (username, password, OpenAI API key) are loaded from .env
# See .env.example for required environment variables

# ============================================================================
# Personal Information
# ============================================================================
phone_number: "7542757752"  # Your phone number for applications

# Salary expectations
salary: 160000  # Annual salary expectation (numeric, no commas)
rate: 60        # Hourly rate expectation

# ============================================================================
# Job Search Preferences
# ============================================================================
# Use double quotes for each position/location (recommended for keywords with spaces or special chars)
positions:
  - "AI Engineer"
  - "Generative AI Engineer"
  - "Agentic AI Engineer"
  # Add more (keep double quotes):
  # - "Machine Learning Engineer"
  # - "MLOps Engineer"
  # - "Data Scientist"
locations:
  - "United States"
  - "Remote"
  # Add more (keep double quotes):
  # - "San Francisco, CA"
  # - "New York, NY"
  # - "San Jose, CA"
  # - "Los Angeles, CA"
  # - "Chicago, IL"
  # - "Boston, MA"
  # - "Seattle, WA"
  # - "Austin, TX"
  # - "Dallas, TX"

# ============================================================================
# Search Filters (Applied via URL Parameters)
# ============================================================================
search:
  filters:
    # Date Posted Filter
    # Options: "24h" (past 24 hours), "week" (past week), "month" (past month), "any"
    date_posted: "24h"
    
    # Workplace Type Filter (can select multiple)
    # Options: "remote", "hybrid", "onsite" (or "on-site")
    workplace_type:
      - remote
      - hybrid
      - onsite

# Experience Level Filter (can select multiple)
# Options: "Internship", "Entry level", "Associate", "Mid-Senior level", "Director", "Executive"
experience_level:
  - Associate
  - Mid-Senior level

# ============================================================================
# File Uploads
# ============================================================================
uploads:
  Resume: /Users/ram_surya/Documents/LinkedIn-Easy-Apply-Bot/Ramana_Gangarao_Resume.pdf
  Cover Letter: /Users/ram_surya/Documents/LinkedIn-Easy-Apply-Bot/Ramana_Gangarao_Resume.pdf
  # Photo: /path/to/photo.jpg  # Uncomment and add path if needed

# ============================================================================
# Output Configuration
# ============================================================================
output_filename:
  - output/applications.csv

# ============================================================================
# Blacklists (Optional)
# ============================================================================
# Companies to avoid (case-insensitive matching)
blacklist: []
  # - Company Name 1
  # - Company Name 2

# Job titles to avoid (case-insensitive matching)
blackListTitles: []
  # - Sales
  # - Marketing

# ============================================================================
# Q&A memory lookup (optional; env QA_MEMORY_* overrides these)
# ============================================================================
qa_memory:
  fuzzy_threshold_high: 88      # auto-accept fuzzy token_set_ratio score
  fuzzy_threshold_low: 62     # min score to keep candidate for embed/LLM tiers
  fuzzy_candidate_limit: 40
  intent_llm_enabled: true    # Ollama picks best match among fuzzy candidates
  intent_top_k: 25
  embedding_enabled: false      # set true if you pull nomic-embed-text (or similar)
  embedding_model: nomic-embed-text
  embedding_threshold: 0.82

# ============================================================================
# Advanced Settings
# ============================================================================
# Require manual confirmation before submitting each application
require_submission_confirmation: false

# Maximum time to spend searching for jobs (in seconds)
# Default: 3600 (1 hour)
max_search_time: 3600
